[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palmistry-system"
version = "0.3.0"
description = "可复核的掌纹观察、传统象征组合与易学基础工具"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
palmistry = "palmistry.__main__:main"

[tool.setuptools.package-data]
palmistry = ["data/*.json"]
